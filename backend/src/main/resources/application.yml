spring:
  application:
    name: stockmanager-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockmanager}
    username: ${DB_USERNAME:stockmanager}
    password: ${DB_PASSWORD:stockmanager}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/pdf,text/html,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-please-32}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    issuer: ${JWT_ISSUER:stockmanager-cloud}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    exposed-headers: Content-Disposition
    max-age: 3600
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./storage/documents}
    s3-bucket: ${S3_BUCKET_DOCUMENTS:}
    s3-region: ${AWS_REGION:eu-west-3}
    presigned-url-minutes: ${S3_PRESIGNED_MINUTES:15}
  admin:
    email: ${ADMIN_EMAIL:admin@stockmanager.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
    first-name: ${ADMIN_FIRST_NAME:System}
    last-name: ${ADMIN_LAST_NAME:Administrator}
  seed:
    demo-enabled: ${SEED_DEMO_DATA:false}

logging:
  level:
    root: INFO
    com.stockmanager: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

management.endpoint.health.show-details: never
