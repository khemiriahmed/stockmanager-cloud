services:
  postgres:
    image: postgres:16-alpine
    container_name: stockmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockmanager}
      POSTGRES_USER: ${POSTGRES_USER:-stockmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockmanager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockmanager} -d ${POSTGRES_DB:-stockmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stockmanager-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockmanager-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stockmanager}}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-stockmanager}}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-stockmanager}}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-please-32}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@stockmanager.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/storage/documents
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8081}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - documents-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - stockmanager-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockmanager-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stockmanager-net

volumes:
  postgres-data:
  documents-storage:

networks:
  stockmanager-net:
    driver: bridge
